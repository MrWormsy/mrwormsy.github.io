<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance | Crystal Toolbox</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
            margin: 0;
        }

        /* Subtle Entrance Animation */
        .fade-in-up {
            animation: fadeInUp 0.8s ease-out forwards;
            opacity: 0;
            transform: translateY(15px);
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body class="bg-white min-h-screen flex items-center justify-center selection:bg-orange-100">

    <main class="w-full max-w-3xl mx-auto px-6 text-center fade-in-up">
        
        <!-- Minimalist Orange Icon -->
        <div class="mb-8 mx-auto inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-orange-50 text-orange-500">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                <line x1="12" y1="22.08" x2="12" y2="12"></line>
            </svg>
        </div>
        
        <!-- Maintenance Message -->
        <h1 class="text-3xl md:text-5xl font-bold mb-4 tracking-tight text-orange-600 leading-tight">
            La toolbox de Crystal est en maintenance
        </h1>
        
        <p class="text-lg md:text-xl text-orange-400 font-medium max-w-lg mx-auto mt-4">
            Désolé pour la gêne occasionnée.
        </p>
        
    </main>

</body>
</html>
